<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arewa AI - Smart Community Assistant</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f1f5f2;
  margin: 0;
  padding: 15px;
}

.container {
  max-width: 550px;
  margin: 30px auto;
  background: white;
  padding: 22px;
  border-radius: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h1 {
  color: #087443;
  text-align: center;
}

.subtitle {
  text-align: center;
  color: #555;
}

#chat {
  background: #f5f8f5;
  border-radius: 10px;
  padding: 12px;
  min-height: 180px;
  max-height: 350px;
  overflow-y: auto;
  margin: 20px 0;
}

.message {
  padding: 12px;
  border-radius: 10px;
  margin: 10px 0;
  line-height: 1.5;
  white-space: pre-wrap;
}

.user {
  background: #d9f3e3;
  text-align: right;
}

.bot {
  background: #e9edf0;
  text-align: left;
}

.input-area {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
}

button {
  background: #087443;
  color: white;
  border: none;
  padding: 13px 17px;
  border-radius: 8px;
  cursor: pointer;
}

button:disabled {
  background: #888;
}

.footer {
  text-align: center;
  color: #777;
  font-size: 12px;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<h1>🌍 Arewa AI</h1>

<p class="subtitle">
Your Smart Community Assistant
</p>

<p>
Get helpful guidance on education, jobs, agriculture
and community development.
</p>

<div id="chat">
<div class="message bot">
Welcome to Arewa AI! 👋

How can I help you today?
</div>
</div>

<div class="input-area">

<input
id="question"
type="text"
placeholder="Ask Arewa AI a question..."
>

<button id="sendButton" onclick="askAI()">
Ask
</button>

</div>

<p class="footer">
Empowering Northern Nigerian Communities with AI.
</p>

</div>

<script>

const API_URL = "YOUR_CLOUDFLARE_WORKER_URL";

const chat = document.getElementById("chat");
const input = document.getElementById("question");
const button = document.getElementById("sendButton");

function addMessage(message, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = message;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function askAI() {

  const question = input.value.trim();

  if (!question) {
    alert("Please enter a question.");
    return;
  }

  addMessage(question, "user");

  input.value = "";
  button.disabled = true;
  button.textContent = "Thinking...";

  const loading = addMessage(
    "Arewa AI is preparing your answer...",
    "bot"
  );

  try {

    if (API_URL === "YOUR_CLOUDFLARE_WORKER_URL") {
      throw new Error("AI backend is not connected yet.");
    }

    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        question: question
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "The server returned an error.");
    }

    loading.textContent =
      data.answer || "I could not generate an answer.";

  } catch (error) {

    loading.textContent =
      "Connection problem: " + error.message +
      "\nPlease try again later.";

  } finally {

    button.disabled = false;
    button.textContent = "Ask";

  }
}

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    askAI();
  }
});

</script>

</body>
</html>
